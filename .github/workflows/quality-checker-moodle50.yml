name: Moodle 5.0 Plugin Quality Check

on:
  pull_request:
    branches: [ release/moodle50 ]

jobs:
  quality:
    name: Checking Plugin
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        php: ['8.2']
        moodle-branch: ['MOODLE_405_STABLE']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl,mbstring,pdo_mysql,xml,curl,gd
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache Moodle CI
        uses: actions/cache@v3
        with:
          path: ci
          key: moodle-ci-${{ matrix.moodle-branch }}

      - name: Initialise moodle-plugin-ci
        run: |
          if [ ! -d ci ]; then
            composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          fi
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --standard=moodle --max-warnings 50 --exclude=moodle.Files.BoilerplateComment,moodle.PHP.IncludingFile,moodle.Commenting.InlineComment,Generic.NamingConventions.ConstructorName,moodle.Files.LineLength,moodle.ControlStructures.ControlSignature,moodle.Strings.ForbiddenStrings,moodle.Commenting.Package,NormalizedArrays.Arrays.CommaAfterLast,moodle.Commenting.MissingDocblock,moodle.Commenting.FileExpectedTags,moodle.Files.RequireLogin,moodle.Files.MoodleInternal,Generic.Arrays.DisallowLongArraySyntax,moodle.Commenting.VariableComment,Generic.Functions.CallTimePassByReference,Squiz.Classes.DuplicateProperty,PSR12.Operators.OperatorSpacing,Universal.Lists.DisallowLongListSyntax,PSR2.ControlStructures.SwitchDeclaration

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
